name: Auto-Absen Alpa ASN PKM Barugaia

on:
  schedule:
    # Pukul 15:00 WITA (07:00 UTC) setiap hari Senin - Sabtu
    - cron: '0 7 * * 1-6'
  # Memungkinkan dijalankan manual lewat tombol "Run workflow" di tab Actions
  workflow_dispatch:

# Wajib ditambahkan agar GitHub Actions diizinkan melakukan auto-commit
permissions:
  contents: write

jobs:
  auto-absen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase Admin SDK
        run: npm install --no-save firebase-admin

      - name: Jalankan Skrip Auto-Absen & Rekap Alpa
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: "https://e-absenpkmbarugaia-default-rtdb.asia-southeast1.firebasedatabase.app/"
        run: node scripts/auto-absen.js

      - name: Reset Timer Inaktivitas 60 Hari (Auto-Commit)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          TZ='Asia/Makassar' date +"Terakhir berjalan: %Y-%m-%d %H:%M:%S WITA" > cron-heartbeat.txt
          git add cron-heartbeat.txt
          git commit -m "chore: update med-sync cron heartbeat [skip ci]" || exit 0
          git push
